<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Playbox 原版与优化版对比</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111318;
        color: #f5f2ea;
        font-family:
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          system-ui,
          sans-serif;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(17, 19, 24, 0.9);
        backdrop-filter: blur(14px);
      }

      .topbar strong {
        font-size: 16px;
      }

      .topbar span {
        color: #9ba0ad;
        font-size: 12px;
      }

      .compare-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 12px;
        min-height: calc(100vh - 57px);
      }

      .panel {
        display: flex;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        background: #1a1d24;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .panel-header strong {
        font-size: 14px;
      }

      .badge {
        padding: 5px 9px;
        border-radius: 999px;
        background: #39251f;
        color: #ff8166;
        font-size: 11px;
        font-weight: 800;
      }

      .badge.old {
        background: #30343f;
        color: #f5f2ea;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 120px);
        min-height: 720px;
        border: 0;
        background: #f5f3ee;
      }

      @media (max-width: 760px) {
        .compare-grid {
          grid-template-columns: 1fr;
        }

        iframe {
          height: 78vh;
          min-height: 620px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <strong>Mini Playbox 界面对比</strong>
      <span>左侧为优化版，右侧为历史原版</span>
    </div>
    <main class="compare-grid">
      <section class="panel">
        <div class="panel-header">
          <strong>优化版</strong>
          <span class="badge">当前</span>
        </div>
        <iframe src="http://127.0.0.1:8080/" title="优化版界面"></iframe>
      </section>
      <section class="panel">
        <div class="panel-header">
          <strong>原版</strong>
          <span class="badge old">历史</span>
        </div>
        <iframe src="http://127.0.0.1:8081/" title="原版界面"></iframe>
      </section>
    </main>
  </body>
</html>
