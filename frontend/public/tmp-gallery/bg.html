<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>战斗页背景 · 十版</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .design { position: fixed; inset: 0; display: none; }
  .design.on { display: block; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* 1 夜障孤营：深夜山影 + 军帐剪影 + 篝火微光 */
  .d1 { background: linear-gradient(180deg, #06090f 0%, #0c1119 45%, #17110b 78%, #0a0704 100%); }
  .d1 .fire { position: absolute; left: 18%; bottom: 6%; width: 46vw; height: 34vh;
    background: radial-gradient(ellipse at center, rgba(224,120,40,.22), rgba(224,120,40,.06) 45%, transparent 70%); }
  .d1 .fire2 { position: absolute; right: 14%; bottom: 4%; width: 34vw; height: 26vh;
    background: radial-gradient(ellipse at center, rgba(224,120,40,.16), transparent 68%); }

  /* 2 残阳血原：血色残阳压在地平线 */
  .d2 { background: linear-gradient(180deg, #12060a 0%, #3d0d10 38%, #8a2414 58%, #1a0806 78%, #080404 100%); }
  .d2 .sun { position: absolute; left: 62%; top: 52%; width: 22vw; height: 22vw; transform: translate(-50%, -50%);
    border-radius: 50%; background: radial-gradient(circle, rgba(255,120,60,.95), rgba(200,60,30,.5) 52%, transparent 72%);
    filter: blur(2px); }
  .d2 .haze { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(10,3,3,.55) 100%); }

  /* 3 烽燧狼烟：荒原烽燧 + 一柱狼烟 + 冷月 */
  .d3 { background: linear-gradient(180deg, #070a0d 0%, #0d1315 50%, #0b0d0c 100%); }
  .d3 .moon { position: absolute; right: 18%; top: 12%; width: 9vw; height: 9vw; border-radius: 50%;
    background: radial-gradient(circle, rgba(220,228,235,.85), rgba(200,210,220,.18) 55%, transparent 75%); }
  .d3 .smoke { position: absolute; left: 30%; bottom: 30%; width: 16vw; height: 62vh;
    background: radial-gradient(ellipse at 50% 100%, rgba(180,180,190,.14), rgba(180,180,190,.05) 55%, transparent 78%);
    filter: blur(14px); }

  /* 4 铁幕孤城：城垣箭垛剪影 + 旗影 + 铁青天 */
  .d4 { background: linear-gradient(180deg, #0b1016 0%, #101822 52%, #090c10 100%); }
  .d4 .cold { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,32,44,.0), rgba(20,32,44,.24) 100%); }

  /* 5 风沙古道：斜切风沙 + 土黄尘幕 */
  .d5 { background:
    repeating-linear-gradient(112deg, rgba(210,180,120,.05) 0 2px, transparent 2px 26px),
    linear-gradient(180deg, #241a0c 0%, #4a3418 46%, #241a0a 100%); }
  .d5 .dust { position: absolute; inset: 0;
    background: radial-gradient(ellipse at 70% 20%, rgba(200,170,110,.14), transparent 55%),
                radial-gradient(ellipse at 25% 70%, rgba(160,130,80,.12), transparent 60%); }

  /* 6 霜天冷月：巨月悬空 + 霜雾横带 */
  .d6 { background: linear-gradient(180deg, #04070c 0%, #0a1622 46%, #0e2028 74%, #050a0e 100%); }
  .d6 .moon { position: absolute; left: 24%; top: 16%; width: 16vw; height: 16vw; border-radius: 50%;
    background: radial-gradient(circle, rgba(226,238,248,.9), rgba(200,220,235,.22) 55%, transparent 76%); }
  .d6 .mist { position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 52%, rgba(160,200,220,.07) 62%, transparent 70%, rgba(160,200,220,.05) 82%, transparent 92%); }

  /* 7 焦土余烬：炭黑大地 + 上升火星 */
  .d7 { background: linear-gradient(180deg, #050303 0%, #120704 55%, #1c0a05 80%, #050303 100%); }
  .d7 .embers { position: absolute; inset: 0;
    background:
      radial-gradient(circle at 12% 82%, rgba(255,140,50,.5) 0 2px, transparent 3px),
      radial-gradient(circle at 26% 64%, rgba(255,120,40,.4) 0 1.6px, transparent 3px),
      radial-gradient(circle at 38% 88%, rgba(255,150,60,.45) 0 2px, transparent 3px),
      radial-gradient(circle at 55% 70%, rgba(255,110,40,.35) 0 1.5px, transparent 3px),
      radial-gradient(circle at 68% 86%, rgba(255,140,50,.45) 0 2px, transparent 3px),
      radial-gradient(circle at 81% 60%, rgba(255,120,40,.35) 0 1.6px, transparent 3px),
      radial-gradient(circle at 90% 78%, rgba(255,150,60,.4) 0 2px, transparent 3px); }

  /* 8 雾渡大江：青灰江雾横带 + 远岸剪影 */
  .d8 { background: linear-gradient(180deg, #0a1114 0%, #122026 52%, #0a1216 100%); }
  .d8 .mist { position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(170,200,205,.1) 55%, rgba(150,190,195,.16) 66%, transparent 78%); }

  /* 9 万箭穿云：暮空 + 箭雨流光 */
  .d9 { background: linear-gradient(180deg, #140a08 0%, #2e1410 44%, #180a08 72%, #0a0504 100%); }
  .d9 .arrows { position: absolute; inset: -20%;
    background: repeating-linear-gradient(118deg, transparent 0 46px, rgba(240,200,150,.06) 46px 48px, transparent 48px 120px); }
  .d9 .arrows2 { position: absolute; inset: -20%;
    background: repeating-linear-gradient(118deg, transparent 0 90px, rgba(240,200,150,.09) 90px 92px, transparent 92px 230px); }

  /* 10 玄旗猎猎：连营黑旗剪影 + 暗红天光 */
  .d10 { background: linear-gradient(180deg, #0a0508 0%, #1c0c10 46%, #2a0e10 62%, #0a0506 100%); }
  .d10 .red { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 58%, rgba(160,30,30,.14) 100%); }
</style>
</head>
<body>

      </g>

  <script>
    const d = new URLSearchParams(location.search).get("d") || "1";
